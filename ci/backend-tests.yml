# Copy to .github/workflows/backend-tests.yml. Runs on every pull request:
#   check        lint + typecheck + unit and API tests with coverage (no Docker)
#   integration  tests against a real MySQL, and Redis if the service uses one
#                (Testcontainers; GitHub's Ubuntu runners have Docker)
#   security     secrets in the commits of this change, and known-vulnerable dependencies
name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck
      - run: npm run test:unit:coverage
      - name: Coverage summary
        # Only when the tests got far enough to write one (not when lint or typecheck failed).
        if: ${{ always() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total; console.log('## Unit test coverage\n\nLines ' + t.lines.pct + '% | Branches ' + t.branches.pct + '% | Functions ' + t.functions.pct + '%\n\nCode that only integration tests reach (queries, repositories) counts as uncovered here.')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('coverage/coverage-summary.json') != '' }}
        with:
          name: coverage-${{ github.run_number }}
          path: coverage/lcov-report
          retention-days: 7

  integration:
    name: Integration tests (MySQL, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  security:
    name: Security (secrets, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks reads the commits, not only the files
      - name: No secrets in the commits of this change
        # Only this change's commits, so a secret committed years ago does not fail every pull
        # request for ever (rotate it, and scan the whole history once: see the kit README).
        # A false positive goes in .gitleaksignore, by the fingerprint the report prints.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$BASE" in ''|0000000*) range="-1 $HEAD" ;; *) range="$BASE..$HEAD" ;; esac
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --no-banner --redact --log-opts="$range" .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: No critical vulnerability in what ships
        # Runtime dependencies only (--omit=dev), and only "critical" blocks: an advisory
        # published overnight should not stop an unrelated pull request. Read the rest with
        # `npm audit` and fix them on their own schedule.
        run: npm audit --omit=dev --audit-level=critical
